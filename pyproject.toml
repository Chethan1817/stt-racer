[project]
name = "stt-fusion-agent"
version = "0.1.0"
description = "LiveKit voice agent that races several STT engines and fuses their transcripts with an LLM before replying."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents[deepgram,openai,groq]==1.8.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
